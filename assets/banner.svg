<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="blobTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobViolet" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#5eead4"/>
      <stop offset="95%" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="52"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="44"/></filter>
  </defs>

  <rect width="1200" height="480" fill="#020617"/>

  <circle cx="240" cy="70" r="250" fill="url(#blobTeal)" filter="url(#blur1)"/>
  <circle cx="970" cy="150" r="220" fill="url(#blobViolet)" filter="url(#blur2)"/>
  <circle cx="140" cy="420" r="180" fill="url(#blobAmber)" filter="url(#blur3)"/>

  <text x="600" y="255" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="800"
        font-size="96" fill="url(#titleGrad)"
        textLength="620" lengthAdjust="spacingAndGlyphs">CASCADE</text>

  <text x="600" y="308" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="500"
        font-size="20" fill="rgba(255,255,255,0.65)"
        textLength="760" lengthAdjust="spacingAndGlyphs">Cross-System, Multi-Scale Single-Cell Foundation Model with Clinical Applications</text>

  <text x="600" y="345" text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif" font-weight="400"
        font-size="15" fill="rgba(255,255,255,0.4)"
        textLength="820" lengthAdjust="spacingAndGlyphs">Context-aware single-cell modelling linking cellular programmes to patient-level disease phenotypes</text>
</svg>
